<!DOCTYPE html>
<title>Todo List</title>
<body>
<div class="container">
    <h1>items</h1>
    <button id="fetchBtn">Request items from replaceme.c</button>
    <div class="status" id="status">Ready</div>
    <div class="items" id="items"></div>
</div>

<script>
    const itemsDiv = document.getElementById('items');
    const statusDiv = document.getElementById('status');
    const fetchBtn = document.getElementById('fetchBtn');

    // Show status
    function setStatus(msg, isError = false) {
        statusDiv.textContent = msg;
    }

    // Create clickable items from array
    function renderitems(arr) {
        itemsDiv.innerHTML = '';
        
        if (!arr || arr.length === 0) {
            itemsDiv.innerHTML = '<div class="empty">Nothing to do!</div>';
            return;
        }
        
        for (let i = 0; i < arr.length; i++) {
            const item = arr[i];
            const items = document.createElement('div');
            item.className = 'item';
            // Display item nicely
            let displayText = typeof item === 'object' ? JSON.stringify(item) : String(item);
            if (displayText.length > 40) displayText = displayText.slice(0, 37) + '...';
            item.textContent = displayText;
            
            // Click handler
            item.onclick = () => {
                alert(`You clicked: ${JSON.stringify(item, null, 2)}`);
                console.log('Clicked:', item, 'at index', i);
            };
            
            itemsDiv.appendChild(item);
        }
    }

    // Fetch the array from replaceme.c
    async function fetchArray() {
        try {
            const response = await fetch('replaceme.c');
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (!Array.isArray(data)) {
                throw new Error('Response is not an array');
            }
            
            renderitems(data);
            
        } catch (err) {
            setStatus(`Error: ${err.message}`, true);
            itemsDiv.innerHTML = `<div class="empty">Failed to load. Make sure replaceme.c returns a JSON array.</div>`;
        }
    }

    // Load on page start
    fetchArray();
    
    // Refresh on button click
    fetchBtn.onclick = fetchArray;
</script>
</body>
</html>
